<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StoreForge AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;box-sizing:border-box}
body{margin:0;background:#fcfcfc;color:#111}
header{padding:18px 30px;background:white;border-bottom:1px solid #eee;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:20px}.logo span{color:#7c3aed}
.hero{max-width:800px;margin:80px auto 40px;text-align:center;padding:0 20px}
.hero h1{font-size:52px;line-height:1.05;margin:0;letter-spacing:-2px;font-weight:800}
.hero p{color:#666;font-size:18px;margin:16px 0 18px}
.modeBox{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.modeBtn{padding:9px 16px;border-radius:20px;border:1px solid #eee;background:white;cursor:pointer;font-size:13px;font-weight:600}
.modeBtn.active{background:#111;color:white}
.manualBox{display:none;max-width:600px;margin:0 auto 18px;background:white;padding:14px;border-radius:14px;border:1px solid #eee}
.manualBox.show{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.searchWrap{position:relative;max-width:600px;margin:0 auto}
.searchBox{display:flex;gap:10px;background:white;padding:8px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);border:1px solid #eee}
.searchBox input{flex:1;border:none;outline:none;padding:15px;font-size:16px;border-radius:12px}
.searchBox button{background:#111;color:white;border:none;padding:15px 28px;border-radius:12px;font-weight:600;cursor:pointer}
.suggest{position:absolute;top:108%;left:0;right:0;background:white;border:1px solid #eee;border-radius:14px;z-index:100;display:none;box-shadow:0 15px 40px rgba(0,0,0,.12);overflow:hidden}
.suggest div{padding:13px 16px;cursor:pointer;font-size:14px;text-align:left;border-bottom:1px solid #f6f6f6}
.suggest div:hover{background:#f5f5ff}
.historyChips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chip{background:#eee;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}
.result{max-width:1200px;margin:40px auto;padding:0 20px}
.gridReal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px}
.prodReal{background:white;border:2px solid #eee;border-radius:16px;overflow:hidden;cursor:pointer;position:relative}
.prodReal.selected{border-color:#7c3aed;box-shadow:0 0 0 3px #ede9fe}
.prodReal img{width:100%;height:190px;object-fit:contain;background:#fff;display:block;padding:8px}
.prodInfo{padding:12px}
.badge-vendido{position:absolute;top:8px;left:8px;background:#ff3b30;color:white;font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px;z-index:2}
.check{position:absolute;top:8px;right:8px;width:26px;height:26px;background:white;border:2px solid #ddd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2}
.btnGen{background:#111;color:white;border:none;padding:16px 32px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;margin:24px auto;display:block}
.myStores{max-width:1100px;margin:60px auto 30px;padding:0 20px}
.storesGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.miniStore{background:white;border:1px solid #eee;border-radius:16px;padding:16px;cursor:pointer;position:relative}
.del{position:absolute;top:8px;right:8px;background:#fee2e2;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px}
#tiendaReal{display:none;position:fixed;inset:0;background:#fafafa;z-index:9999;overflow:auto}
#prodModal,#checkoutModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;align-items:center;justify-content:center;padding:12px}
.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:14px}
</style>
</head>
<body>
<header><div class="logo">⬢ StoreForge<span>.AI</span></div><div style="font-size:13px;color:#888">100% IA Local</div></header>
<div id="app">
<div class="hero">
<h1>Crea tu tienda online en segundos</h1>
<p>Nuestra IA hace el trabajo pesado y tú escoges qué vender</p>
<div class="modeBox">
<button class="modeBtn active" id="btnIA" onclick="setMode('ia')">🤖 Que la IA cree todo</button>
<button class="modeBtn" id="btnManual" onclick="setMode('manual')">✏️ Yo la creo</button>
</div>
<div class="manualBox" id="manualBox">
<input class="input" id="m_nombre" placeholder="Nombre tienda">
<input class="input" id="m_slogan" placeholder="Slogan">
<div style="display:flex;gap:8px;align-items:center"><input type="color" id="m_color" value="#7c3aed" style="width:44px;height:36px;border:none"><small>Color</small></div>
<input class="input" id="m_inicial" placeholder="Inicial">
</div>
<div class="searchWrap">
<div class="searchBox">
<input id="nicho" autocomplete="off" placeholder="Ej: huawei, samsung, zapatos..." oninput="onType()" onfocus="onType()" onkeydown="if(event.key==='Enter'){cerrarSug(); buscarReales()}">
<button onclick="buscarReales()">Buscar productos →</button>
</div>
<div class="suggest" id="suggest"></div>
</div>
<div class="historyChips" id="historyChips"></div>
</div>
<div class="result" id="resultado"></div>
<div class="myStores"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:18px;margin:0">📦 Mis Tiendas</h2><button onclick="limpiarDuplicadas()" style="background:white;border:1px solid #eee;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px">Limpiar</button></div><div class="storesGrid" id="storesGrid"></div></div>
</div>
<div id="tiendaReal"></div>
<div id="prodModal" onclick="if(event.target.id==='prodModal') cerrarModal()"></div>
<div id="checkoutModal" onclick="if(event.target.id==='checkoutModal') cerrarCheckout()"></div>
<script>
let modo='ia';
let productosReales=[], seleccionados=[], marcaActual=null;
let tiendasGuardadas = JSON.parse(localStorage.getItem('misTiendasReal')||'[]');
let historial = (JSON.parse(localStorage.getItem('historialBusq')||'[]')).filter(h=>h && h.length>=2);
localStorage.setItem('historialBusq', JSON.stringify(historial));
let tiendaActualProds=[], carrito=[];
const baseSugs=['huawei','samsung','laptop','hp','zapatos','audifonos'];
renderMisTiendas(); renderHistorial();
function setMode(m){ modo=m; document.getElementById('btnIA').classList.toggle('active',m==='ia'); document.getElementById('btnManual').classList.toggle('active',m==='manual'); document.getElementById('manualBox').classList.toggle('show',m==='manual'); }
function renderHistorial(){ document.getElementById('historyChips').innerHTML=historial.slice(0,10).map(h=>`<div class="chip" onclick="document.getElementById('nicho').value='${h}'; buscarReales()">${h}</div>`).join(''); }
function onType(){
  const v=document.getElementById('nicho').value.toLowerCase().trim();
  const box=document.getElementById('suggest');
  if(v.length<1){ box.style.display='none'; return; }
  const lista=[...new Set([...baseSugs.filter(s=>s.includes(v)),...historial.filter(h=>h.toLowerCase().includes(v))])].filter(s=>s.length>=2).slice(0,7);
  if(lista.length===0){ box.style.display='none'; return; }
  box.innerHTML=lista.map(s=>`<div onmousedown="event.preventDefault(); document.getElementById('nicho').value='${s}'; cerrarSug(); buscarReales();">🔍 ${s}</div>`).join('');
  box.style.display='block';
}
function cerrarSug(){ document.getElementById('suggest').style.display='none'; }
function guardarHist(q){ if(!q || q.length<2) return; historial=historial.filter(h=>h!==q); historial.unshift(q); historial=historial.slice(0,15); localStorage.setItem('historialBusq',JSON.stringify(historial)); renderHistorial(); }
function renderMisTiendas(){const g=document.getElementById('storesGrid');if(!tiendasGuardadas.length){g.innerHTML='<p style="color:#999;font-size:14px">Aún no has creado tiendas.</p>';return;}g.innerHTML=tiendasGuardadas.map(t=>`<div class="miniStore" onclick="cargarTiendaGuardada(${t.id})"><button class="del" onclick="event.stopPropagation();borrarTienda(${t.id})">✕</button><div style="width:28px;height:28px;border-radius:8px;background:${t.color};display:flex;align-items:center;justify-content:center;color:white;font-weight:800">${t.nombre[0]}</div><b style="display:block;margin:8px 0 2px">${t.nombre}</b><small style="color:#888">${t.nicho} • ${t.prods.length} prods</small></div>`).join('');}
function borrarTienda(id){tiendasGuardadas=tiendasGuardadas.filter(t=>t.id!==id);localStorage.setItem('misTiendasReal',JSON.stringify(tiendasGuardadas));renderMisTiendas();}
function limpiarDuplicadas(){const seen=new Set();tiendasGuardadas=tiendasGuardadas.filter(t=>{const k=t.nombre.toLowerCase()+'|'+t.nicho;if(seen.has(k))return false;seen.add(k);return true;});localStorage.setItem('misTiendasReal',JSON.stringify(tiendasGuardadas));renderMisTiendas();}
function cargarTiendaGuardada(id){const t=tiendasGuardadas.find(x=>x.id==id);if(!t)return;mostrarTiendaFinal({nombre:t.nombre,nicho:t.nicho,color:t.color,slogan:t.slogan},t.prods);}
function generarNombre(nicho,n){let nombre=(n||'').split('(')[0].replace(/"/g,'').replace(/\*\*/g,'').replace(/[^a-zA-Z0-9 &]/g,'').trim();if(!nombre||nombre.length<3)nombre='Aura House';return nombre.split(' ').slice(0,2).join(' ');}
async function fetchConProxy(url){
  try{
    if(url.includes('/search')){
      const q = new URL(url).searchParams.get('q');
      const site = url.match(/sites\/(.*?)\//)?.[1] || 'MLV';
      const r = await fetch(`/api/buscar?q=${encodeURIComponent(q)}&site=${site}`);
      if(!r.ok) return null;
      return await r.json();
    }
    if(url.includes('/items/')){
      const id = url.split('/items/')[1].split('?')[0];
      const r = await fetch(`/api/item/${id}`);
      if(!r.ok) return null;
      return await r.json();
    }
  }catch(e){ return null; }
  return null;
}
async function buscarReales(){
  const raw=document.getElementById('nicho').value.trim().toLowerCase(); if(raw.length<2)return;
  cerrarSug(); guardarHist(raw);
  document.getElementById('resultado').innerHTML=`<div style="text-align:center;padding:40px;background:white;border-radius:20px;border:1px solid #eee">Buscando <b>${raw}</b>...</div>`;
  seleccionados=[];
  if(modo==='manual'){
    marcaActual={nombre:document.getElementById('m_nombre').value||generarNombre(raw,''), slogan:document.getElementById('m_slogan').value||`Selección de ${raw}`, color:document.getElementById('m_color').value||'#7c3aed', nicho:raw};
  }else{
    try{
      const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),800);
      const r=await fetch('http://localhost:11434/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'llama3.2:3b',prompt:`Nicho: ${raw}. NOMBRE: [1 palabra] SLOGAN: [4 palabras] COLOR: [#hex]`,stream:false}), signal:ctrl.signal});
      const d=await r.json(); const get=k=>(d.response.match(new RegExp(k+':\\s*(.*)','i'))||[])[1]?.split('(')[0].replace(/\*\*/g,'').trim()||''; const col=(get('COLOR').match(/#[0-9a-f]{6}/i)||['#7c3aed'])[0];
      marcaActual={nombre:generarNombre(raw,get('NOMBRE')), slogan:get('SLOGAN')||`Selección de ${raw}`, color:col, nicho:raw};
    }catch(e){ marcaActual={nombre:generarNombre(raw,''), slogan:`Selección de ${raw}`, color:'#7c3aed', nicho:raw}; }
  }
  let todos=[];
  for(let site of ['MLV','MLA','MLM']){
    const apiUrl=`https://api.mercadolibre.com/sites/${site}/search?q=${encodeURIComponent(raw)}&limit=20`;
    const data=await fetchConProxy(apiUrl);
    if(data?.results?.length){
      data.results.forEach(p=>{
        todos.push({id:p.id, title:p.title, price:p.price, currency:p.currency_id, vendidos:p.sold_quantity||0, thumbnail:(p.thumbnail||'').replace('http://','https://')});
      });
      if(todos.length>=20) break;
    }
  }
  if(todos.length===0){
    document.getElementById('resultado').innerHTML=`<div style="text-align:center;padding:30px;background:white;border-radius:16px;border:1px solid #eee">No se encontraron resultados para "${raw}".<br>Intenta de nuevo.<br><br><button onclick="buscarReales()" style="background:#111;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer">Reintentar</button></div>`;
    return;
  }
  todos.sort((a,b)=>b.vendidos-a.vendidos);
  const seen=new Set(); let unicos=[];
  for(let p of todos){ if(!seen.has(p.id) && p.thumbnail){seen.add(p.id); unicos.push(p);} if(unicos.length>=24) break; }
  productosReales=unicos;
  render();
}
function render(){
  document.getElementById('resultado').innerHTML=`
    <div style="background:white;border-radius:20px;padding:24px;border:1px solid #eee">
      <span style="background:#f3f0ff;color:#7c3aed;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600">${productosReales.length} productos encontrados</span>
      <h2 style="margin:14px 0 4px;font-size:28px">${marcaActual.nombre}</h2>
      <p style="color:#666;margin:0 0 14px">${marcaActual.slogan}</p>
      <div class="gridReal">
        ${productosReales.map((p,i)=>`<div class="prodReal" id="pr-${i}" onclick="toggleProd(${i})">${i<3?'<div class="badge-vendido">🔥 MÁS VENDIDO</div>':''}<div class="check">✓</div><img src="${p.thumbnail}" referrerpolicy="no-referrer" loading="lazy"><div class="prodInfo"><small style="background:#f5f5f5;padding:2px 6px;border-radius:10px;font-size:10px;color:#666">${p.vendidos} vendidos</small><b style="font-size:12.5px;display:block;margin-top:5px;line-height:1.2">${p.title.slice(0,70)}</b><div style="margin-top:6px"><b>${p.currency} ${Number(p.price).toLocaleString()}</b></div></div></div>`).join('')}
      </div>
      <button class="btnGen" id="btnCrear" onclick="crearTiendaNueva()" disabled>Selecciona productos (<span id="countSel">0</span>)</button>
    </div>`;
}
function toggleProd(i){const el=document.getElementById(`pr-${i}`);const idx=seleccionados.indexOf(i);if(idx>-1){seleccionados.splice(idx,1);el.classList.remove('selected');}else{seleccionados.push(i);el.classList.add('selected');}document.getElementById('countSel').innerText=seleccionados.length;document.getElementById('btnCrear').disabled=seleccionados.length===0;}
function crearTiendaNueva(){if(!seleccionados.length)return;const elegidos=seleccionados.map(i=>productosReales[i]);const nueva={id:Date.now(),nombre:marcaActual.nombre,nicho:marcaActual.nicho,color:marcaActual.color,slogan:marcaActual.slogan,prods:elegidos};if(!tiendasGuardadas.some(t=>t.nombre===nueva.nombre&&t.nicho===nueva.nicho)){tiendasGuardadas.unshift(nueva);localStorage.setItem('misTiendasReal',JSON.stringify(tiendasGuardadas.slice(0,20)));renderMisTiendas();}mostrarTiendaFinal(marcaActual,elegidos);}
function mostrarTiendaFinal(t,elegidos){
  tiendaActualProds=elegidos; carrito=[];
  const html=`<div style="background:#fafafa;min-height:100vh"><header style="background:white;padding:18px 28px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20"><b style="font-size:20px">${t.nombre}</b><div style="display:flex;gap:10px"><button onclick="abrirCheckout()" style="background:${t.color};color:white;border:none;padding:8px 14px;border-radius:8px;cursor:pointer">🛒 Carrito (<span id="cartCount">0</span>)</button><button onclick="document.getElementById('tiendaReal').style.display='none';document.getElementById('app').style.display='block'" style="background:white;border:1px solid #eee;padding:8px 14px;border-radius:8px;cursor:pointer">← Volver</button></div></header><div style="background:${t.color};padding:60px 20px;text-align:center;color:white"><h1 style="font-size:48px;margin:0">${t.nombre}</h1><p style="opacity:.9">${t.slogan}</p></div><div style="max-width:1100px;margin:30px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:100px">${elegidos.map((p,i)=>`<div style="background:white;border-radius:20px;overflow:hidden;border:1px solid #eee"><div style="cursor:pointer" onclick="abrirDetalle('${p.id}')"><img src="${p.thumbnail}" style="width:100%;height:280px;object-fit:contain;padding:10px" referrerpolicy="no-referrer"><div style="padding:14px"><h3 style="margin:0;font-size:14px">${p.title.slice(0,80)}</h3><p style="color:#666;font-size:12px;margin:4px 0">${p.vendidos} vendidos</p><b style="font-size:18px">${p.currency} ${Number(p.price).toLocaleString()}</b></div></div><div style="padding:0 14px 14px"><button onclick="addToCart(${i})" style="width:100%;background:#111;color:white;border:none;padding:12px;border-radius:10px;font-weight:600;cursor:pointer">Añadir al carrito</button></div></div>`).join('')}</div></div>`;
  document.getElementById('tiendaReal').innerHTML=html; document.getElementById('tiendaReal').style.display='block'; document.getElementById('app').style.display='none';
}
function addToCart(idx){carrito.push(tiendaActualProds[idx]); document.getElementById('cartCount').innerText=carrito.length;}
async function abrirDetalle(itemId){
  const p=tiendaActualProds.find(x=>x.id===itemId);
  const modal=document.getElementById('prodModal'); modal.style.display='flex';
  modal.innerHTML=`<div style="background:white;border-radius:20px;max-width:900px;width:100%;padding:20px;text-align:center">Cargando...</div>`;
  const data=await fetchConProxy(`https://api.mercadolibre.com/items/${itemId}`);
  if(!data ||!data.title){
    modal.innerHTML=`<div style="background:white;padding:20px;border-radius:20px;max-width:600px;width:100%"><h3>${p.title}</h3><img src="${p.thumbnail}" style="width:100%;height:300px;object-fit:contain"><p>${p.vendidos} vendidos</p><button onclick="cerrarModal()" style="background:#111;color:white;border:none;padding:10px 20px;border-radius:8px">Cerrar</button></div>`;
    return;
  }
  const pics=data.pictures||[{url:p.thumbnail}];
  modal.innerHTML=`<div style="background:white;border-radius:20px;max-width:1000px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr"><div style="padding:16px;background:#fafafa"><img id="mainImg" src="${pics[0].url||pics[0].secure_url}" style="width:100%;height:400px;object-fit:contain;background:white;border-radius:12px" referrerpolicy="no-referrer"><div style="display:flex;gap:8px;margin-top:10px;overflow-x:auto">${pics.slice(0,8).map(pic=>`<img src="${pic.url||pic.secure_url}" style="width:60px;height:60px;object-fit:contain;border:1px solid #eee;border-radius:8px;cursor:pointer" onclick="document.getElementById('mainImg').src=this.src" referrerpolicy="no-referrer">`).join('')}</div></div><div style="padding:20px"><div style="display:flex;justify-content:space-between"><span style="background:#f5f5f5;padding:4px 10px;border-radius:20px;font-size:11px">${data.sold_quantity||p.vendidos} vendidos</span><button onclick="cerrarModal()" style="background:#eee;border:none;padding:6px 12px;border-radius:8px;cursor:pointer">✕</button></div><h2 style="margin:12px 0 6px;line-height:1.2;font-size:20px">${data.title}</h2><div style="margin:12px 0"><b style="font-size:30px">${data.currency_id} ${Number(data.price).toLocaleString()}</b></div><button onclick="addToCart(${tiendaActualProds.indexOf(p)});cerrarModal();" style="width:100%;background:#111;color:white;border:none;padding:14px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:10px">🛒 Añadir al carrito</button></div></div>`;
}
function cerrarModal(){document.getElementById('prodModal').style.display='none';}
function abrirCheckout(){ if(carrito.length===0){alert('Carrito vacío'); return;} alert('Carrito: '+carrito.length+' productos'); }
function cerrarCheckout(){document.getElementById('checkoutModal').style.display='none';}
</script>
</body>
</html>
