<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StoreForge AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;box-sizing:border-box}
body{margin:0;background:#fcfcfc;color:#111}
header{padding:18px 30px;background:white;border-bottom:1px solid #eee;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:20px}.logo span{color:#7c3aed}
.hero{max-width:800px;margin:80px auto 40px;text-align:center;padding:0 20px}
.hero h1{font-size:52px;line-height:1.05;margin:0;letter-spacing:-2px;font-weight:800}
.hero p{color:#666;font-size:18px;margin:16px 0 28px}
.searchBox{display:flex;gap:10px;max-width:600px;margin:0 auto;background:white;padding:8px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);border:1px solid #eee}
.searchBox input{flex:1;border:none;outline:none;padding:15px;font-size:16px;border-radius:12px}
.searchBox button{background:#111;color:white;border:none;padding:15px 28px;border-radius:12px;font-weight:600;cursor:pointer}
.result{max-width:1200px;margin:40px auto;padding:0 20px}
.gridReal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px}
.prodReal{background:white;border:2px solid #eee;border-radius:16px;overflow:hidden;cursor:pointer;position:relative}
.prodReal.selected{border-color:#7c3aed;box-shadow:0 0 0 3px #ede9fe}
.prodReal img{width:100%;height:190px;object-fit:contain;background:#fff;display:block;padding:8px}
.prodInfo{padding:12px}
.badge-vendido{position:absolute;top:8px;left:8px;background:#ff3b30;color:white;font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px;z-index:2}
.check{position:absolute;top:8px;right:8px;width:26px;height:26px;background:white;border:2px solid #ddd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2}
.btnGen{background:#111;color:white;border:none;padding:16px 32px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;margin:24px auto;display:block}
.myStores{max-width:1100px;margin:60px auto 30px;padding:0 20px}
.storesGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.miniStore{background:white;border:1px solid #eee;border-radius:16px;padding:16px;cursor:pointer;position:relative}
.del{position:absolute;top:8px;right:8px;background:#fee2e2;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px}
#tiendaReal{display:none;position:fixed;inset:0;background:#fafafa;z-index:9999;overflow:auto}
#prodModal,#checkoutModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;align-items:center;justify-content:center;padding:12px}
.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:14px}
</style>
</head>
<body>
<header><div class="logo">⬢ StoreForge<span>.AI</span></div><div style="font-size:13px;color:#888">100% IA Local • Productos Reales</div></header>
<div id="app">
<div class="hero">
<h1>Crea tu tienda online en segundos</h1>
<p>Nuestra IA hace el trabajo pesado y tú escoges qué vender</p>
<div class="searchBox">
<input id="nicho" placeholder="Ej: samsung, camisa, ropa..." onkeydown="if(event.key==='Enter')buscarReales()">
<button onclick="buscarReales()">Buscar productos →</button>
</div>
</div>
<div class="result" id="resultado"></div>
<div class="myStores"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:18px;margin:0">📦 Mis Tiendas</h2><button onclick="limpiarDuplicadas()" style="background:white;border:1px solid #eee;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px">Limpiar</button></div><div class="storesGrid" id="storesGrid"></div></div>
</div>
<div id="tiendaReal"></div>
<div id="prodModal" onclick="if(event.target.id==='prodModal') cerrarModal()"></div>
<div id="checkoutModal" onclick="if(event.target.id==='checkoutModal') cerrarCheckout()"></div>
<script>
let productosReales=[], seleccionados=[], marcaActual=null;
let tiendasGuardadas = JSON.parse(localStorage.getItem('misTiendasReal')||'[]');
let tiendaActualProds=[], carrito=[];
renderMisTiendas();
function renderMisTiendas(){const g=document.getElementById('storesGrid');if(!tiendasGuardadas.length){g.innerHTML='<p style="color:#999;font-size:14px">Aún no has creado tiendas.</p>';return;}g.innerHTML=tiendasGuardadas.map(t=>`<div class="miniStore" onclick="cargarTiendaGuardada(${t.id})"><button class="del" onclick="event.stopPropagation();borrarTienda(${t.id})">✕</button><div style="width:28px;height:28px;border-radius:8px;background:${t.color};display:flex;align-items:center;justify-content:center;color:white;font-weight:800">${t.nombre[0]}</div><b style="display:block;margin:8px 0 2px">${t.nombre}</b><small style="color:#888">${t.nicho} • ${t.prods.length} prods</small></div>`).join('');}
function borrarTienda(id){tiendasGuardadas=tiendasGuardadas.filter(t=>t.id!==id);localStorage.setItem('misTiendasReal',JSON.stringify(tiendasGuardadas));renderMisTiendas();}
function limpiarDuplicadas(){const seen=new Set();tiendasGuardadas=tiendasGuardadas.filter(t=>{const k=t.nombre.toLowerCase()+'|'+t.nicho;if(seen.has(k))return false;seen.add(k);return true;});localStorage.setItem('misTiendasReal',JSON.stringify(tiendasGuardadas));renderMisTiendas();}
function cargarTiendaGuardada(id){const t=tiendasGuardadas.find(x=>x.id==id);if(!t)return;mostrarTiendaFinal({nombre:t.nombre,nicho:t.nicho,color:t.color,slogan:t.slogan},t.prods);}
function generarNombreOriginal(nicho,n){let nombre=(n||'').split('(')[0].replace(/"/g,'').replace(/\*\*/g,'').replace(/[^a-zA-Z0-9 &]/g,'').trim();if(!nombre||nombre.length<3)nombre='Aura House';return nombre.split(' ').slice(0,2).join(' ');}

// ARREGLADO PARA RENDER - DIRECTO SIN PROXY NI LOCALHOST
async function fetchRealConProxy(url){
  try{
    const r = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

async function buscarReales(){
  const raw=document.getElementById('nicho').value.trim().toLowerCase(); if(!raw)return;
  document.getElementById('resultado').innerHTML=`<div style="text-align:center;padding:40px;background:white;border-radius:20px;border:1px solid #eee">🌎 Buscando <b>${raw}</b> en tiendas reales...</div>`;
  seleccionados=[];
  // MARCA ORIGINAL - sin localhost para que no se tranque en Render
  const colores=['#7c3aed','#ff3b30','#111','#0ea5e9','#10b981'];
  marcaActual={nombre: raw.charAt(0).toUpperCase()+raw.slice(1)+' Store', slogan:`Selección premium de ${raw}`, color:colores[Math.floor(Math.random()*colores.length)], nicho:raw};

  const paises = ['MLM','MLA','MCO','MLB','MLC','MLU','MPE','MLV'];
  const urls = paises.map(p=>`https://api.mercadolibre.com/sites/${p}/search?q=${encodeURIComponent(raw)}&limit=15`);
  const resultados = await Promise.all(urls.map(u=>fetchRealConProxy(u)));
  let todos=[];
  resultados.forEach(res=>{
    if(res && res.results){
      res.results.forEach(p=>{
        if(p.title && p.thumbnail){
          todos.push({id:p.id,title:p.title,price:p.price,currency:p.currency_id,vendidos:p.sold_quantity||0,thumbnail:p.thumbnail.replace('http://','https://').replace('I.jpg','O.jpg'),permalink:p.permalink,condition:p.condition||'new'});
        }
      });
    }
  });
  todos.sort((a,b)=>b.vendidos-a.vendidos);
  const seen=new Set(); let unicos=[];
  for(let p of todos){ if(!seen.has(p.id)){seen.add(p.id); unicos.push(p);} if(unicos.length>=24) break; }
  productosReales=unicos;
  if(productosReales.length===0){
    document.getElementById('resultado').innerHTML=`<div style="text-align:center;padding:30px;background:white;border-radius:16px">No se encontraron resultados para "${raw}". Intenta de nuevo con: celulares, iphone, camisa, ropa.</div>`;
    return;
  }
  render();
}
function render(){
  document.getElementById('resultado').innerHTML=`
    <div style="background:white;border-radius:20px;padding:24px;border:1px solid #eee">
      <span style="background:#f3f0ff;color:#7c3aed;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600">✨ ${productosReales.length} publicaciones reales de MercadoLibre</span>
      <h2 style="margin:14px 0 4px;font-size:28px">${marcaActual.nombre}</h2>
      <p style="color:#666;margin:0 0 14px">${marcaActual.slogan}</p>
      <div class="gridReal">
        ${productosReales.map((p,i)=>`<div class="prodReal" id="pr-${i}" onclick="toggleProd(${i})">${i<3?'<div class="badge-vendido">🔥 MÁS VENDIDO</div>':''}<div class="check">✓</div><img src="${p.thumbnail}" referrerpolicy="no-referrer" onerror="this.src='https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500'"><div class="prodInfo"><small style="background:#f5f5f5;padding:2px 6px;border-radius:10px;font-size:10px;color:#666">${p.vendidos} vendidos • ${p.condition==='new'?'Nuevo':'Usado'}</small><b style="font-size:12.5px;display:block;margin-top:5px;line-height:1.2">${p.title.slice(0,70)}</b><div style="margin-top:6px"><b>${p.currency} ${Number(p.price).toLocaleString()}</b></div></div></div>`).join('')}
      </div>
      <button class="btnGen" id="btnCrear" onclick="crearTiendaNueva()" disabled>Selecciona productos (<span id="countSel">0</span>)</button>
    </div>`;
}
function toggleProd(i){const el=document.getElementById(`pr-${i}`);const idx=seleccionados.indexOf(i);if(idx>-1){seleccionados.splice(idx,1);el.classList.remove('selected');}else{seleccionados.push(i);el.classList.add('selected');}document.getElementById('countSel').innerText=seleccionados.length;document.getElementById('btnCrear').disabled=seleccionados.length===0;}
function crearTiendaNueva(){if(!seleccionados.length)return;const elegidos=seleccionados.map(i=>productosReales[i]);const nueva={id:Date.now(),nombre:marcaActual.nombre,nicho:marcaActual.nicho,color:marcaActual.color,slogan:marcaActual.slogan,prods:elegidos};if(!tiendasGuardadas.some(t=>t.nombre===nueva.nombre&&t.nicho===nueva.nicho)){tiendasGuardadas.unshift(nueva);localStorage.setItem('misTiendasReal',JSON.stringify(tiendasGuardadas.slice(0,20)));renderMisTiendas();}mostrarTiendaFinal(marcaActual,elegidos);}
function mostrarTiendaFinal(t,elegidos){
  tiendaActualProds=elegidos; carrito=[];
  const html=`<div style="background:#fafafa;min-height:100vh"><header style="background:white;padding:18px 28px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20"><b style="font-size:20px">${t.nombre}</b><div style="display:flex;gap:10px"><button onclick="abrirCheckout()" style="background:${t.color};color:white;border:none;padding:8px 14px;border-radius:8px;cursor:pointer">🛒 Carrito (<span id="cartCount">0</span>)</button><button onclick="document.getElementById('tiendaReal').style.display='none';document.getElementById('app').style.display='block'" style="background:white;border:1px solid #eee;padding:8px 14px;border-radius:8px;cursor:pointer">← Volver</button></div></header><div style="background:white;padding:60px 20px;text-align:center"><h1 style="font-size:48px;margin:0">${t.nombre}</h1><p style="color:#666">${t.slogan}</p></div><div style="max-width:1100px;margin:30px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:100px">${elegidos.map((p,i)=>`<div style="background:white;border-radius:20px;overflow:hidden;border:1px solid #eee"><div style="cursor:pointer" onclick="abrirDetalle(${i})"><img src="${p.thumbnail}" style="width:100%;height:280px;object-fit:contain;padding:10px"><div style="padding:14px"><h3 style="margin:0;font-size:14px">${p.title.slice(0,80)}</h3><p style="color:#666;font-size:12px;margin:4px 0">${p.vendidos} vendidos • Nuevo</p><b style="font-size:18px">${p.currency} ${Number(p.price).toLocaleString()}</b></div></div><div style="padding:0 14px 14px"><button onclick="addToCart(${i})" style="width:100%;background:#111;color:white;border:none;padding:12px;border-radius:10px;font-weight:600;cursor:pointer">Añadir al carrito</button></div></div>`).join('')}</div></div>`;
  document.getElementById('tiendaReal').innerHTML=html; document.getElementById('tiendaReal').style.display='block'; document.getElementById('app').style.display='none';
}
function addToCart(idx){const p=tiendaActualProds[idx]; carrito.push(p); document.getElementById('cartCount').innerText=carrito.length;}
async function abrirDetalle(idx){
  const p=tiendaActualProds[idx]; const modal=document.getElementById('prodModal'); modal.style.display='flex';
  modal.innerHTML=`<div style="background:white;border-radius:20px;max-width:900px;width:100%;padding:20px;text-align:center">Cargando publicación real ${p.id}... 🌎</div>`;
  try{
    const [it, d] = await Promise.all([fetchRealConProxy(`https://api.mercadolibre.com/items/${p.id}`), fetchRealConProxy(`https://api.mercadolibre.com/items/${p.id}/description`).catch(()=>({plain_text:''}))]);
    const item=it||{title:p.title, price:p.price, currency_id:p.currency, sold_quantity:p.vendidos, pictures:[{url:p.thumbnail}], attributes:[]};
    const desc=d||{plain_text:''};
    const pics=item.pictures||[{url:p.thumbnail}];
    const attrs=item.attributes?item.attributes.slice(0,8).map(a=>`<tr><td style="color:#666;font-size:13px;padding:6px 10px 6px 0">${a.name}</td><td style="font-size:13px;font-weight:600">${a.value_name}</td></tr>`).join(''):'';
    modal.innerHTML=`<div style="background:white;border-radius:20px;max-width:1000px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr"><div style="padding:16px;background:#fafafa"><img id="mainImg" src="${pics[0].url.replace('http://','https://')}" style="width:100%;height:400px;object-fit:contain;background:white;border-radius:12px"><div style="display:flex;gap:8px;margin-top:10px;overflow-x:auto">${pics.slice(0,8).map(pic=>`<img src="${pic.url.replace('http://','https://')}" style="width:60px;height:60px;object-fit:contain;border:1px solid #eee;border-radius:8px;cursor:pointer" onclick="document.getElementById('mainImg').src=this.src">`).join('')}</div></div><div style="padding:20px"><div style="display:flex;justify-content:space-between"><span style="background:#f5f5f5;padding:4px 10px;border-radius:20px;font-size:11px">● ${item.sold_quantity||p.vendidos} vendidos • Publicación real</span><button onclick="cerrarModal()" style="background:#eee;border:none;padding:6px 12px;border-radius:8px;cursor:pointer">✕</button></div><h2 style="margin:12px 0 6px;line-height:1.2;font-size:20px">${item.title}</h2><div style="margin:12px 0"><b style="font-size:30px">${item.currency_id} ${Number(item.price).toLocaleString()}</b></div><div style="margin:10px 0"><table>${attrs}</table></div><p style="white-space:pre-wrap;font-size:13px;line-height:1.5;background:#fafafa;padding:12px;border-radius:10px;max-height:220px;overflow:auto">${(desc.plain_text||item.title).slice(0,2000)}</p><button onclick="addToCart(${idx});cerrarModal();abrirCheckout()" style="width:100%;background:#111;color:white;border:none;padding:14px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:10px">🛒 Añadir al carrito y comprar</button><small style="color:#999;display:block;margin-top:8px">ID real: ${p.id} • api.mercadolibre.com</small></div></div>`;
  }catch(e){ modal.innerHTML=`<div style="background:white;padding:30px;border-radius:20px">Error cargando real: ${e.message}<br><button onclick="cerrarModal()">Cerrar</button></div>`; }
}
function cerrarModal(){document.getElementById('prodModal').style.display='none';}
function abrirCheckout(){
  if(carrito.length===0){alert('Tu carrito está vacío'); return;}
  const modal=document.getElementById('checkoutModal');
  const total=carrito.reduce((s,p)=>s+Number(p.price),0);
  const currency=carrito[0]?.currency||'USD';
  modal.style.display='flex';
  modal.innerHTML=`
    <div style="background:white;border-radius:20px;max-width:500px;width:100%;max-height:92vh;overflow:auto;padding:24px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="margin:0">Finalizar compra</h2><button onclick="cerrarCheckout()" style="background:#eee;border:none;padding:6px 12px;border-radius:8px;cursor:pointer">✕</button></div>
      <div style="background:#fafafa;padding:12px;border-radius:12px;margin-bottom:16px"><small style="color:#666">${carrito.length} productos</small><div style="margin-top:6px">${carrito.map(p=>`<div style="display:flex;justify-content:space-between;font-size:13px;margin:4px 0"><span>${p.title.slice(0,35)}...</span><b>${p.currency} ${Number(p.price).toLocaleString()}</b></div>`).join('')}<\/div><div style="border-top:1px solid #eee;margin-top:10px;padding-top:10px;display:flex;justify-content:space-between"><b>Total</b><b>${currency} ${total.toLocaleString()}<\/b><\/div><\/div>
      <div>
        <input class="input" id="c_nombre" placeholder="Nombre completo">
        <input class="input" id="c_telefono" placeholder="Teléfono / WhatsApp">
        <input class="input" id="c_email" placeholder="Email">
        <input class="input" id="c_direccion" placeholder="Dirección completa">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <input class="input" id="c_ciudad" placeholder="Ciudad">
          <input class="input" id="c_estado" placeholder="Estado / Provincia">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <input class="input" id="c_pais" placeholder="País">
          <input class="input" id="c_zip" placeholder="Código postal">
        </div>
        <textarea class="input" id="c_nota" placeholder="Nota para el envío (opcional)" style="height:60px"><\/textarea>
        <button onclick="confirmarPedido()" style="width:100%;background:#111;color:white;border:none;padding:14px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:12px">Confirmar pedido y pagar<\/button>
      <\/div>
    <\/div>`;
}
function cerrarCheckout(){document.getElementById('checkoutModal').style.display='none';}
function confirmarPedido(){
  const nombre=document.getElementById('c_nombre').value;
  const tel=document.getElementById('c_telefono').value;
  const dir=document.getElementById('c_direccion').value;
  if(!nombre||!tel||!dir){alert('Por favor completa nombre, teléfono y dirección'); return;}
  const total=carrito.reduce((s,p)=>s+Number(p.price),0);
  const texto=`Hola! Nuevo pedido:%0A%0A${carrito.map(p=>'- '+p.title+' $'+p.price).join('%0A')}%0A%0ATotal: $${total}%0A%0ACliente: ${nombre}%0ATel: ${tel}%0ADirección: ${dir}`;
  window.open('https://wa.me/584000000000?text='+texto,'_blank');
  alert('Pedido enviado!'); carrito=[]; cerrarCheckout(); cerrarModal();
  const cc=document.getElementById('cartCount'); if(cc) cc.innerText='0';
}
</script>
</body>
</html>
